<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FlashDeck">
<meta name="theme-color" content="#7c6fff">
<meta name="mobile-web-app-capable" content="yes">
<title>FlashDeck</title>
<style>
:root {
  --bg: #0f0f14;
  --surf: #1c1c28;
  --surf2: #26263a;
  --surf3: #303048;
  --border: #33334a;
  --txt: #eeeef8;
  --txt2: #8888aa;
  --txt3: #5555778;
  --accent: #7c6fff;
  --accent-dim: #3d3580;
  --again: #ff4757;
  --hard: #ffa502;
  --good: #2ed573;
  --easy: #1e90ff;
  --r: 16px;
  --nav: 68px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--txt);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}

#app { height: 100%; position: relative; }

/* ── NAV ── */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--nav);
  background: var(--surf);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 300;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  border: none; background: none;
  color: var(--txt2); font-size: 10px; font-weight: 600;
  cursor: pointer; letter-spacing: .4px;
  transition: color .2s;
  padding-top: 4px;
}
.nav-btn.active { color: var(--accent); }
.nav-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ── SCREENS ── */
.screen {
  display: none; position: absolute;
  inset: 0; bottom: var(--nav);
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
.screen.active { display: block; }

/* ── SHARED ── */
.page-head {
  padding: 20px 20px 10px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: var(--bg); z-index: 10;
}
.page-head h1 { font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
.page-head h2 { font-size: 20px; font-weight: 700; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--surf2); border: 1px solid var(--border);
  color: var(--txt); display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.empty {
  text-align: center; padding: 60px 32px;
  color: var(--txt2); font-size: 15px; line-height: 1.6;
}
.empty .emoji { font-size: 48px; display: block; margin-bottom: 12px; }

/* ── DECKS ── */
#screen-decks { background: var(--bg); }
.deck-list { padding: 4px 16px 16px; }
.deck-item {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px 18px;
  margin-bottom: 10px;
  display: flex; align-items: center;
  cursor: pointer;
  transition: background .15s;
  gap: 12px;
}
.deck-item:active { background: var(--surf2); }
.deck-info { flex: 1; min-width: 0; }
.deck-name { font-size: 16px; font-weight: 600; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deck-counts { display: flex; gap: 10px; font-size: 13px; font-weight: 600; }
.c-new { color: var(--easy); }
.c-lrn { color: var(--hard); }
.c-due { color: var(--good); }
.deck-arrow { color: var(--txt2); }
.deck-arrow svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.fab {
  position: fixed; bottom: calc(var(--nav) + 16px); right: 16px;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--accent); border: none; color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: 0 4px 20px rgba(124,111,255,.4);
  z-index: 50; font-size: 26px; font-weight: 300;
  transition: transform .15s;
}
.fab:active { transform: scale(.93); }

/* ── STUDY SCREEN ── */
#screen-study { background: var(--bg); display: none; flex-direction: column; }
#screen-study.active { display: flex; bottom: 0; z-index: 400; }

.study-bar {
  padding: 12px 16px 8px;
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
}
.study-back {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--surf2); border: none; color: var(--txt);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.study-back svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.progress-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s ease; }
.study-num { font-size: 12px; font-weight: 700; color: var(--txt2); min-width: 48px; text-align: right; }

.card-stage {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 12px 16px;
  min-height: 0;
}
.card-wrap {
  width: 100%; max-width: 520px;
  transition: transform .15s ease, opacity .15s ease;
}
.card-wrap.flipping {
  transform: scale(0.92);
  opacity: 0;
}
.card-face {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 32px 28px;
  min-height: 240px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 8px 40px rgba(0,0,0,.4);
  user-select: none;
}
.card-face.back {
  display: none;
  cursor: default;
}
.card-face.back.visible {
  display: flex;
}
.card-label {
  font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
  color: var(--accent); text-transform: uppercase; margin-bottom: 16px;
}
.card-text {
  font-size: 17px; line-height: 1.6; color: var(--txt);
  font-weight: 500;
}
.card-text.front { font-size: 19px; font-weight: 600; }
.tap-hint {
  margin-top: 20px; font-size: 12px; color: var(--txt2);
  display: flex; align-items: center; gap: 5px;
}
.tap-hint svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.rating-area {
  flex-shrink: 0; padding: 12px 16px;
  padding-bottom: max(20px, env(safe-area-inset-bottom, 20px));
  display: none; flex-direction: column; gap: 10px;
}
.rating-area.visible { display: flex; }
.rating-row { display: flex; gap: 8px; }
.rating-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 3px;
  padding: 12px 6px;
  border-radius: 14px; border: 1.5px solid;
  background: none; cursor: pointer;
  transition: transform .1s, opacity .1s;
  color: var(--txt);
}
.rating-btn:active { transform: scale(.95); opacity: .85; }
.r-again { border-color: var(--again); }
.r-hard  { border-color: var(--hard); }
.r-good  { border-color: var(--good); }
.r-easy  { border-color: var(--easy); }
.r-again:hover { background: rgba(255,71,87,.12); }
.r-hard:hover  { background: rgba(255,165,2,.12); }
.r-good:hover  { background: rgba(46,213,115,.12); }
.r-easy:hover  { background: rgba(30,144,255,.12); }
.rating-label { font-size: 14px; font-weight: 700; }
.rating-interval { font-size: 11px; font-weight: 600; opacity: .7; }
.r-again .rating-label { color: var(--again); }
.r-hard  .rating-label { color: var(--hard); }
.r-good  .rating-label { color: var(--good); }
.r-easy  .rating-label { color: var(--easy); }

.study-done {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 32px; text-align: center; gap: 12px;
}
.done-emoji { font-size: 64px; }
.done-title { font-size: 24px; font-weight: 700; }
.done-sub { font-size: 15px; color: var(--txt2); line-height: 1.5; }
.done-btn {
  margin-top: 16px; padding: 14px 36px;
  background: var(--accent); border: none; border-radius: 50px;
  color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
}

/* ── BROWSE ── */
#screen-browse { background: var(--bg); }
.search-wrap { padding: 8px 16px 12px; }
.search-input {
  width: 100%; padding: 10px 14px;
  background: var(--surf); border: 1px solid var(--border);
  border-radius: 10px; color: var(--txt); font-size: 15px;
  outline: none;
}
.search-input::placeholder { color: var(--txt2); }
.search-input:focus { border-color: var(--accent); }

.card-list { padding: 0 16px 16px; }
.card-row {
  background: var(--surf); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 16px;
  margin-bottom: 8px; cursor: pointer;
  transition: background .15s;
}
.card-row:active { background: var(--surf2); }
.card-row-front { font-size: 14px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-row-back { font-size: 13px; color: var(--txt2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-row-meta { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
.state-badge {
  font-size: 10px; font-weight: 700; letter-spacing: .5px;
  padding: 2px 7px; border-radius: 20px; text-transform: uppercase;
}
.state-new      { background: rgba(30,144,255,.2);  color: var(--easy); }
.state-learning { background: rgba(255,165,2,.2);   color: var(--hard); }
.state-review   { background: rgba(46,213,115,.2);  color: var(--good); }
.state-relearning { background: rgba(255,71,87,.2); color: var(--again); }
.deck-badge {
  font-size: 11px; color: var(--txt2); font-weight: 500;
}

/* ── STATS ── */
#screen-stats { background: var(--bg); }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 8px 16px 16px; }
.stat-card {
  background: var(--surf); border: 1px solid var(--border);
  border-radius: var(--r); padding: 18px 16px;
  text-align: center;
}
.stat-value { font-size: 30px; font-weight: 800; color: var(--accent); letter-spacing: -1px; }
.stat-label { font-size: 12px; color: var(--txt2); font-weight: 600; margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }

.forecast-title { padding: 8px 16px 6px; font-size: 13px; font-weight: 700; color: var(--txt2); text-transform: uppercase; letter-spacing: .5px; }
.forecast-bars { padding: 0 16px 16px; display: flex; gap: 6px; align-items: flex-end; height: 100px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bar-fill { width: 100%; border-radius: 4px 4px 0 0; background: var(--accent); opacity: .7; min-height: 4px; transition: height .3s; }
.bar-label { font-size: 9px; color: var(--txt2); font-weight: 600; }

/* ── MODALS ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.7); z-index: 400;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surf); border-radius: 24px 24px 0 0;
  padding: 24px 20px 40px;
  width: 100%; max-width: 600px;
  max-height: 85vh; overflow-y: auto;
}
.modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 18px; }
.modal-row { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
.input-group { margin-bottom: 14px; }
.input-group label { display: block; font-size: 12px; font-weight: 700; color: var(--txt2); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.input-group input, .input-group textarea, .input-group select {
  width: 100%; padding: 12px 14px;
  background: var(--surf2); border: 1px solid var(--border);
  border-radius: 10px; color: var(--txt); font-size: 15px;
  outline: none; font-family: inherit;
}
.input-group textarea { resize: vertical; min-height: 80px; }
.input-group input:focus, .input-group textarea:focus, .input-group select:focus { border-color: var(--accent); }
.btn {
  padding: 12px 24px; border-radius: 50px; border: none;
  font-size: 15px; font-weight: 700; cursor: pointer;
  transition: opacity .15s;
}
.btn:active { opacity: .8; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-ghost   { background: var(--surf2); color: var(--txt); }
.btn-danger  { background: var(--again); color: #fff; }
.btn-sm { padding: 8px 18px; font-size: 13px; }

/* Deck action menu */
.deck-menu { position: absolute; right: 0; top: 100%; background: var(--surf2); border: 1px solid var(--border); border-radius: 12px; padding: 6px; z-index: 100; min-width: 160px; box-shadow: 0 8px 32px rgba(0,0,0,.5); }
.deck-menu-item { padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; }
.deck-menu-item:hover { background: var(--surf3); }
.deck-menu-item.danger { color: var(--again); }

/* Import section */
.import-area { border: 2px dashed var(--border); border-radius: 12px; padding: 24px; text-align: center; cursor: pointer; color: var(--txt2); font-size: 14px; transition: border-color .2s; }
.import-area:hover { border-color: var(--accent); color: var(--accent); }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Animations */
@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
.card-wrap { animation: slideUp .3s ease; }

/* Done stats */
.session-stats { display: flex; gap: 20px; justify-content: center; margin-top: 8px; }
.session-stat { text-align: center; }
.session-stat .n { font-size: 22px; font-weight: 800; }
.session-stat .l { font-size: 12px; color: var(--txt2); font-weight: 600; }

@media (min-width: 520px) {
  .rating-row { max-width: 480px; margin: 0 auto; }
  .card-stage { padding: 20px 24px; }
}
</style>
</head>
<body>
<div id="app">

  <!-- ── DECKS SCREEN ── -->
  <div class="screen active" id="screen-decks">
    <div class="page-head">
      <h1>📚 FlashDeck</h1>
      <div style="display:flex;gap:8px">
        <button class="icon-btn" onclick="openImportModal()" title="Importér TSV">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="icon-btn" onclick="openAddDeckModal()" title="Nyt deck">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>
    <div class="deck-list" id="deck-list"></div>
    <button class="fab" onclick="openAddCardModal()" title="Tilføj kort">+</button>
  </div>

  <!-- ── STUDY SCREEN ── -->
  <div class="screen" id="screen-study">
    <div class="study-bar">
      <button class="study-back" onclick="exitStudy()">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="progress-wrap"><div class="progress-fill" id="study-progress" style="width:0%"></div></div>
      <div class="study-num" id="study-num">0/0</div>
    </div>
    <div class="card-stage" id="card-stage">
      <div class="card-wrap" id="card-wrap">
        <div class="card-face front" id="card-front" onclick="flipCard()">
          <div class="card-label">SPØRGSMÅL</div>
          <div class="card-text front" id="card-front-text"></div>
          <div class="tap-hint">
            <svg viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
            Tryk for svar
          </div>
        </div>
        <div class="card-face back" id="card-back">
          <div class="card-label">SVAR</div>
          <div class="card-text" id="card-back-text"></div>
        </div>
      </div>
    </div>
    <div class="rating-area" id="rating-area">
      <div class="rating-row">
        <button class="rating-btn r-again" onclick="rate(1)">
          <span class="rating-label">Igen</span>
          <span class="rating-interval" id="int-again">1 min</span>
        </button>
        <button class="rating-btn r-hard" onclick="rate(2)">
          <span class="rating-label">Svær</span>
          <span class="rating-interval" id="int-hard">6 min</span>
        </button>
        <button class="rating-btn r-good" onclick="rate(3)">
          <span class="rating-label">God</span>
          <span class="rating-interval" id="int-good">10 min</span>
        </button>
        <button class="rating-btn r-easy" onclick="rate(4)">
          <span class="rating-label">Let</span>
          <span class="rating-interval" id="int-easy">4 d</span>
        </button>
      </div>
    </div>
    <div class="study-done" id="study-done" style="display:none">
      <div class="done-emoji">🎉</div>
      <div class="done-title">Deck gennemgået!</div>
      <div class="done-sub">Du har gennemgået alle dagens kort.<br>Kom tilbage i morgen for nye gentagelser.</div>
      <div class="session-stats" id="session-stats"></div>
      <button class="done-btn" onclick="exitStudy()">Tilbage til decks</button>
    </div>
  </div>

  <!-- ── BROWSE SCREEN ── -->
  <div class="screen" id="screen-browse">
    <div class="page-head">
      <h2>Gennemse kort</h2>
    </div>
    <div class="search-wrap">
      <input class="search-input" type="search" placeholder="Søg i kort…" id="search-input" oninput="renderBrowse()">
    </div>
    <div class="card-list" id="card-list"></div>
  </div>

  <!-- ── STATS SCREEN ── -->
  <div class="screen" id="screen-stats">
    <div class="page-head"><h2>Statistik</h2></div>
    <div class="stats-grid" id="stats-grid"></div>
    <div class="forecast-title">KOMMENDE GENTAGELSER (7 DAGE)</div>
    <div class="forecast-bars" id="forecast-bars"></div>
  </div>

  <!-- ── BOTTOM NAV ── -->
  <nav class="nav">
    <button class="nav-btn active" data-screen="decks" onclick="showScreen('decks')">
      <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      DECKS
    </button>
    <button class="nav-btn" data-screen="browse" onclick="showScreen('browse')">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      SØG
    </button>
    <button class="nav-btn" data-screen="stats" onclick="showScreen('stats')">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      STATS
    </button>
  </nav>
</div>

<!-- ── MODALS ── -->

<!-- Add/Edit Deck -->
<div class="modal-overlay" id="modal-deck">
  <div class="modal">
    <h3 id="deck-modal-title">Nyt deck</h3>
    <div class="input-group">
      <label>Navn</label>
      <input type="text" id="deck-name-input" placeholder="f.eks. Pandora-analyse">
    </div>
    <div class="input-group">
      <label>Nye kort pr. dag</label>
      <input type="number" id="deck-new-input" value="20" min="0" max="9999">
    </div>
    <div class="input-group">
      <label>Maks. gentagelser pr. dag</label>
      <input type="number" id="deck-rev-input" value="200" min="0" max="9999">
    </div>
    <div class="modal-row">
      <button class="btn btn-ghost" onclick="closeModal('modal-deck')">Annuller</button>
      <button class="btn btn-primary" onclick="saveDeck()">Gem</button>
    </div>
  </div>
</div>

<!-- Add/Edit Card -->
<div class="modal-overlay" id="modal-card">
  <div class="modal">
    <h3 id="card-modal-title">Nyt kort</h3>
    <div class="input-group">
      <label>Deck</label>
      <select id="card-deck-select"></select>
    </div>
    <div class="input-group">
      <label>Spørgsmål (forside)</label>
      <textarea id="card-front-input" placeholder="Hvad er…"></textarea>
    </div>
    <div class="input-group">
      <label>Svar (bagside)</label>
      <textarea id="card-back-input" placeholder="Svaret er…"></textarea>
    </div>
    <div class="input-group">
      <label>Tags (kommasepareret)</label>
      <input type="text" id="card-tags-input" placeholder="strategi, regnskab">
    </div>
    <div class="modal-row">

function createSeedDB() {
  const deckId = uid();
  const now = Date.now();
  const notes = [];
  const cards = [];
  PANDORA_CARDS.forEach(([front, back]) => {
    const noteId = uid();
    notes.push({ id: noteId, deckId, front, back, tags: ['pandora'], created: now });
    cards.push({
      id: uid(), noteId, deckId,
      state: 'new', due: now,
      interval: 0, easeFactor: 2.5,
      repetitions: 0, learningStep: 0, lapses: 0,
      lastReviewed: null
    });
  });
  return {
    decks: [{ id: deckId, name: 'Pandora-analyse', newPerDay: 20, reviewPerDay: 200 }],
    notes,
    cards,
    reviews: [],
    dailyNew: {},
    settings: {}
  };
}

//  SM-2 ALGORITHM
// ═══════════════════════════════════════════════

const LEARNING_STEPS = [1, 10]; // minutes

function fmtInterval(ms) {
  const s = ms / 1000, m = s / 60, h = m / 60, d = h / 24;
  if (m < 1)  return '<1 min';
  if (m < 60) return Math.round(m) + ' min';
  if (h < 24) return Math.round(h) + ' t';
  if (d < 30) return Math.round(d) + ' d';
  return Math.round(d / 30) + ' mdr';
}

function previewIntervals(card) {
  // Returns {again, hard, good, easy} as ms
  const c = JSON.parse(JSON.stringify(card));
  return {
    again: previewRate(c, 1),
    hard:  previewRate(c, 2),
    good:  previewRate(c, 3),
    easy:  previewRate(c, 4),
  };
}

function previewRate(card, rating) {
  const now = Date.now();
  if (card.state === 'new' || card.state === 'learning' || card.state === 'relearning') {
    if (rating === 1) return LEARNING_STEPS[0] * 60000;
    if (rating === 4) return 4 * 86400000;
    const step = Math.min((card.learningStep || 0) + 1, LEARNING_STEPS.length - 1);
    if (step >= LEARNING_STEPS.length - 1 && rating === 3) return 1 * 86400000;
    return LEARNING_STEPS[step] * 60000;
  } else {
    if (rating === 1) return 10 * 60000;
    if (rating === 2) return Math.max(1, Math.floor(card.interval * 1.2)) * 86400000;
    if (rating === 3) return Math.max(1, Math.floor(card.interval * card.easeFactor)) * 86400000;
    return Math.max(1, Math.floor(card.interval * card.easeFactor * 1.3)) * 86400000;
  }
}

function scheduleCard(card, rating) {
  const now = Date.now();
  const isLearning = card.state === 'new' || card.state === 'learning' || card.state === 'relearning';

  if (isLearning) {
    if (rating === 1) {
      card.state = card.state === 'new' ? 'learning' : card.state;
      card.learningStep = 0;
      card.due = now + LEARNING_STEPS[0] * 60000;
    } else if (rating === 4) {
      card.state = 'review';
      card.interval = 4;
      card.easeFactor = Math.min(card.easeFactor + 0.15, 2.5);
      card.due = now + 4 * 86400000;
    } else {
      const step = Math.min((card.learningStep || 0) + 1, LEARNING_STEPS.length - 1);
      if (step >= LEARNING_STEPS.length - 1 && rating === 3) {
        // Graduate
        const wasRelearning = card.state === 'relearning';
        card.state = 'review';
        card.interval = wasRelearning ? Math.max(1, Math.floor(card.interval * 0.5)) : 1;
        card.due = now + card.interval * 86400000;
      } else {
        if (card.state === 'new') card.state = 'learning';
        card.learningStep = step;
        card.due = now + LEARNING_STEPS[step] * 60000;
      }
    }
  } else {
    if (rating === 1) {
      card.lapses = (card.lapses || 0) + 1;
      card.state = 'relearning';
      card.learningStep = 0;
      card.easeFactor = Math.max(card.easeFactor - 0.2, 1.3);
      card.interval = Math.max(1, Math.floor(card.interval * 0.5));
      card.due = now + 10 * 60000;
    } else {
      let newInterval;
      if (rating === 2) {
        newInterval = Math.max(card.interval + 1, Math.floor(card.interval * 1.2));
        card.easeFactor = Math.max(card.easeFactor - 0.15, 1.3);
      } else if (rating === 3) {
        newInterval = Math.max(card.interval + 1, Math.floor(card.interval * card.easeFactor));
      } else {
        newInterval = Math.max(card.interval + 1, Math.floor(card.interval * card.easeFactor * 1.3));
        card.easeFactor = Math.min(card.easeFactor + 0.15, 2.5);
      }
      // Fuzz ±5%
      const fuzz = Math.floor((Math.random() - .5) * Math.max(1, newInterval * .1));
      card.interval = Math.max(1, newInterval + fuzz);
      card.due = now + card.interval * 86400000;
      card.state = 'review';
    }
  }
  card.repetitions = (card.repetitions || 0) + 1;
  card.lastReviewed = now;
  return card;
}

// ═══════════════════════════════════════════════
//  STUDY SESSION STATE
// ═══════════════════════════════════════════════

let session = null;

function buildQueue(deckId) {
  const deck = db.decks.find(d => d.id === deckId);
  const today = todayStr();
  if (!db.dailyNew[deckId]) db.dailyNew[deckId] = {};
  const newShownToday = db.dailyNew[deckId][today] || 0;
  const newLimit = (deck.newPerDay || 20) - newShownToday;
  const reviewLimit = deck.reviewPerDay || 200;
  const now = Date.now();

  const allCards = db.cards.filter(c => c.deckId === deckId);

  // New cards (not yet started)
  const newCards = allCards
    .filter(c => c.state === 'new')
    .slice(0, Math.max(0, newLimit));

  // Due review/relearning cards
  const dueCards = allCards
    .filter(c => (c.state === 'review' || c.state === 'relearning') && c.due <= now)
    .sort((a, b) => a.due - b.due)
    .slice(0, reviewLimit);

  // Learning cards due now or very soon
  const learningCards = allCards
    .filter(c => c.state === 'learning' && c.due <= now + 60000);

  return [...learningCards, ...dueCards, ...newCards];
}

function startStudy(deckId) {
  const queue = buildQueue(deckId);
  if (queue.length === 0) {
    alert('Ingen kort at repetere nu 🎉\nKom tilbage senere, eller juster daglige grænser i indstillinger.');
    return;
  }
  session = {
    deckId,
    queue: [...queue],
    idx: 0,
    total: queue.length,
    done: 0,
    again: 0, hard: 0, good: 0, easy: 0,
    flipped: false
  };
  showScreen('study', true);
  renderStudyCard();
}

function renderStudyCard() {
  const s = session;
  if (!s || s.idx >= s.queue.length) {
    // Check if there are more cards to show (learning cards coming due)
    const remaining = db.cards.filter(c => c.deckId === s.deckId && c.state === 'learning');
    showDone();
    return;
  }
  const card = s.queue[s.idx];
  const note = db.notes.find(n => n.id === card.noteId);
  if (!note) { session.idx++; renderStudyCard(); return; }

  // Update progress
  const pct = (s.done / (s.done + s.queue.length - s.idx)) * 100;
  document.getElementById('study-progress').style.width = pct + '%';
  document.getElementById('study-num').textContent = s.done + '/' + (s.done + s.queue.length - s.idx);

  // Set card content
  document.getElementById('card-front-text').textContent = note.front;
  document.getElementById('card-back-text').textContent = note.back;

  // Reset flip state
  s.flipped = false;
  const wrap = document.getElementById('card-wrap');
  wrap.classList.remove('flipping');
  document.getElementById('card-front').style.display = '';
  document.getElementById('card-back').classList.remove('visible');

  // Hide ratings
  document.getElementById('rating-area').classList.remove('visible');

  // Preview intervals
  const prev = previewIntervals(card);
  document.getElementById('int-again').textContent = fmtInterval(prev.again);
  document.getElementById('int-hard').textContent  = fmtInterval(prev.hard);
  document.getElementById('int-good').textContent  = fmtInterval(prev.good);
  document.getElementById('int-easy').textContent  = fmtInterval(prev.easy);

  // Show card stage, hide done
  document.getElementById('card-stage').style.display = '';
  document.getElementById('study-done').style.display = 'none';
  document.getElementById('rating-area').style.display = '';
}

function flipCard() {
  if (session.flipped) return;
  session.flipped = true;
  const wrap = document.getElementById('card-wrap');
  // Animate out
  wrap.classList.add('flipping');
  setTimeout(() => {
    // Swap faces
    document.getElementById('card-front').style.display = 'none';
    document.getElementById('card-back').classList.add('visible');
    // Animate back in
    wrap.classList.remove('flipping');
    // Show rating buttons
    document.getElementById('rating-area').classList.add('visible');
  }, 150);
}

function rate(rating) {
  if (!session || !session.flipped) return;
  const s = session;
  const cardIdx = db.cards.findIndex(c => c.id === s.queue[s.idx].id);
  if (cardIdx === -1) return;

  const card = db.cards[cardIdx];
  const prevState = card.state;
  scheduleCard(card, rating);

  // Track daily new
  if (prevState === 'new') {
    const today = todayStr();
    if (!db.dailyNew[s.deckId]) db.dailyNew[s.deckId] = {};
    db.dailyNew[s.deckId][today] = (db.dailyNew[s.deckId][today] || 0) + 1;
  }

  // Track review stats
  db.reviews.push({ id: uid(), cardId: card.id, timestamp: Date.now(), rating, interval: card.interval });
  if (db.reviews.length > 10000) db.reviews = db.reviews.slice(-10000);

  // Session stats
  if (rating === 1) s.again++;
  else if (rating === 2) s.hard++;
  else if (rating === 3) s.good++;
  else s.easy++;

  // If card is still learning (Again/Hard), re-insert later in queue
  if (card.state === 'learning' || card.state === 'relearning') {
    const laterIdx = Math.min(s.idx + 3, s.queue.length);
    s.queue.splice(laterIdx, 0, { ...card });
  }

  s.done++;
  s.idx++;

  saveDB();
  renderStudyCard();
}

function showDone() {
  document.getElementById('card-stage').style.display = 'none';
  document.getElementById('rating-area').style.display = 'none';
  const el = document.getElementById('study-done');
  el.style.display = 'flex';
  document.getElementById('study-progress').style.width = '100%';
  document.getElementById('study-num').textContent = session.done + '/' + session.done;

  const s = session;
  document.getElementById('session-stats').innerHTML = `
    <div class="session-stat"><div class="n" style="color:var(--again)">${s.again}</div><div class="l">Igen</div></div>
    <div class="session-stat"><div class="n" style="color:var(--hard)">${s.hard}</div><div class="l">Svær</div></div>
    <div class="session-stat"><div class="n" style="color:var(--good)">${s.good}</div><div class="l">God</div></div>
    <div class="session-stat"><div class="n" style="color:var(--easy)">${s.easy}</div><div class="l">Let</div></div>
  `;
}

function exitStudy() {
  session = null;
  showScreen('decks');
  renderDecks();
}

function getDeckCounts(deckId) {
  const today = todayStr();
  const deck = db.decks.find(d => d.id === deckId);
  const now = Date.now();
  const newShownToday = (db.dailyNew[deckId] || {})[today] || 0;
  const newLimit = Math.max(0, (deck?.newPerDay || 20) - newShownToday);
  const cards = db.cards.filter(c => c.deckId === deckId);
  const newCount = Math.min(newLimit, cards.filter(c => c.state === 'new').length);
  const lrnCount = cards.filter(c => c.state === 'learning' && c.due <= now + 60000).length;
  const dueCount = cards.filter(c => (c.state === 'review' || c.state === 'relearning') && c.due <= now).length;
  return { newCount, lrnCount, dueCount };
}

function renderBrowse() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const el = document.getElementById('card-list');
  const cards = db.cards.filter(c => {
    const note = db.notes.find(n => n.id === c.noteId);
    if (!note) return false;
    if (!q) return true;
    return note.front.toLowerCase().includes(q) || note.back.toLowerCase().includes(q) || (note.tags||[]).join(' ').toLowerCase().includes(q);
  });
  if (cards.length === 0) {
    el.innerHTML = `<div class="empty"><span class="emoji">🔍</span>Ingen kort matcher søgningen.</div>`;
    return;
  }
  el.innerHTML = cards.slice(0, 200).map(card => {
    const note = db.notes.find(n => n.id === card.noteId);
    if (!note) return '';
    const deck = db.decks.find(d => d.id === card.deckId);
    const stateLabel = {new:'Ny',learning:'Lær',review:'Review',relearning:'Genlær'}[card.state] || card.state;
    return `
      <div class="card-row" onclick="openEditCardModal('${note.id}')">
        <div class="card-row-front">${esc(note.front)}</div>
        <div class="card-row-back">${esc(note.back)}</div>

          <span class="state-badge state-${card.state}">${stateLabel}</span>
          <span class="deck-badge">${esc(deck?.name || '')}</span>
        </div>
      </div>`;
  }).join('');
}

function renderStats() {
  const now = Date.now();
  const today = todayStr();
  const todayStart = new Date(today).getTime();
  const reviewsToday = db.reviews.filter(r => r.timestamp >= todayStart).length;

  // Streak
  let streak = 0;
  let d = new Date(); d.setHours(0,0,0,0);
  while (true) {
    const s = d.toISOString().slice(0,10);
    const had = db.reviews.some(r => r.timestamp >= d.getTime() && r.timestamp < d.getTime() + 86400000);
    if (!had) break;
    streak++;
    d.setDate(d.getDate() - 1);
  }

  const totalCards = db.cards.length;
  const matureCards = db.cards.filter(c => c.state === 'review' && c.interval >= 21).length;

  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><div class="stat-value">${reviewsToday}</div><div class="stat-label">Kort i dag</div></div>
    <div class="stat-card"><div class="stat-value">${streak}</div><div class="stat-label">Dages streak</div></div>
    <div class="stat-card"><div class="stat-value">${totalCards}</div><div class="stat-label">Kort i alt</div></div>
    <div class="stat-card"><div class="stat-value">${matureCards}</div><div class="stat-label">Modne kort</div></div>
    <div class="stat-card"><div class="stat-value">${db.reviews.length}</div><div class="stat-label">Totale reviews</div></div>
    <div class="stat-card"><div class="stat-value">${db.decks.length}</div><div class="stat-label">Decks</div></div>
  `;

  // Forecast
  const forecast = [];
  for (let i = 0; i < 7; i++) {
    const dayStart = now + i * 86400000;
    const dayEnd = dayStart + 86400000;
    const count = db.cards.filter(c => c.due >= dayStart && c.due < dayEnd && (c.state === 'review' || c.state === 'relearning')).length;
    forecast.push(count);
  }
  const maxFc = Math.max(...forecast, 1);
  const days = ['i dag','i morgen','om 2d','om 3d','om 4d','om 5d','om 6d'];
  const barsEl = document.getElementById('forecast-bars');
  barsEl.innerHTML = forecast.map((n, i) => `
    <div class="bar-col">
      <div class="bar-fill" style="height:${Math.round((n/maxFc)*80)+4}px" title="${n} kort"></div>
      <div class="bar-label">${days[i]}</div>
    </div>
  `).join('');
}

function showScreen(name, noNav) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  if (!noNav) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.screen === name));
  }
  // Render on show
  if (name === 'decks')  renderDecks();
  if (name === 'browse') renderBrowse();
  if (name === 'stats')  renderStats();
}

// Deck modal
function openAddDeckModal() {
  editingDeckId = null;
  document.getElementById('deck-modal-title').textContent = 'Nyt deck';
  document.getElementById('deck-name-input').value = '';
  document.getElementById('deck-new-input').value = 20;
  document.getElementById('deck-rev-input').value = 200;
  openModal('modal-deck');
}

function editDeck(deckId) {
  editingDeckId = deckId;
  const deck = db.decks.find(d => d.id === deckId);
  document.getElementById('deck-modal-title').textContent = 'Redigér deck';
  document.getElementById('deck-name-input').value = deck.name;
  document.getElementById('deck-new-input').value = deck.newPerDay || 20;
  document.getElementById('deck-rev-input').value = deck.reviewPerDay || 200;
  openModal('modal-deck');
}

function saveDeck() {
  const name = document.getElementById('deck-name-input').value.trim();
  if (!name) { alert('Angiv et navn for decket.'); return; }
  const newPerDay = parseInt(document.getElementById('deck-new-input').value) || 20;
  const reviewPerDay = parseInt(document.getElementById('deck-rev-input').value) || 200;

  if (editingDeckId) {
    const deck = db.decks.find(d => d.id === editingDeckId);
    if (deck) { deck.name = name; deck.newPerDay = newPerDay; deck.reviewPerDay = reviewPerDay; }
  } else {
    db.decks.push({ id: uid(), name, newPerDay, reviewPerDay });
  }
  saveDB();
  closeModal('modal-deck');
  renderDecks();
}

function deleteDeck(deckId) {
  if (!confirm('Slet deck og alle tilhørende kort? Dette kan ikke fortrydes.')) return;
  db.decks = db.decks.filter(d => d.id !== deckId);
  db.notes = db.notes.filter(n => n.deckId !== deckId);
  db.cards = db.cards.filter(c => c.deckId !== deckId);
  saveDB();
  renderDecks();
}

// Card modal
function populateDeckSelect(selectId, selectedId) {
  const sel = document.getElementById(selectId);
  sel.innerHTML = db.decks.map(d => `<option value="${d.id}"${d.id === selectedId ? ' selected' : ''}>${esc(d.name)}</option>`).join('');
}

function openAddCardModal(deckId) {
  if (activeMenu) { activeMenu.remove(); activeMenu = null; }
  editingNoteId = null;
  document.getElementById('card-modal-title').textContent = 'Nyt kort';
  document.getElementById('card-front-input').value = '';
  document.getElementById('card-back-input').value = '';
  document.getElementById('card-tags-input').value = '';
  document.getElementById('delete-card-btn').style.display = 'none';
  populateDeckSelect('card-deck-select', deckId || (db.decks[0] || {}).id);
  openModal('modal-card');
}

function openEditCardModal(noteId) {
  editingNoteId = noteId;
  const note = db.notes.find(n => n.id === noteId);
  if (!note) return;
  document.getElementById('card-modal-title').textContent = 'Redigér kort';
  document.getElementById('card-front-input').value = note.front;
  document.getElementById('card-back-input').value = note.back;
  document.getElementById('card-tags-input').value = (note.tags || []).join(', ');
  document.getElementById('delete-card-btn').style.display = '';
  populateDeckSelect('card-deck-select', note.deckId);
  openModal('modal-card');
}

function saveCard() {
  const front = document.getElementById('card-front-input').value.trim();
  const back  = document.getElementById('card-back-input').value.trim();
  const tags  = document.getElementById('card-tags-input').value.split(',').map(t => t.trim()).filter(Boolean);
  const deckId = document.getElementById('card-deck-select').value;
  if (!front || !back) { alert('Udfyld både spørgsmål og svar.'); return; }

  if (editingNoteId) {
    const note = db.notes.find(n => n.id === editingNoteId);
    if (note) { note.front = front; note.back = back; note.tags = tags; note.deckId = deckId;
      // Update card deckId too
      const card = db.cards.find(c => c.noteId === editingNoteId);
      if (card) card.deckId = deckId;
    }
  } else {
    const noteId = uid();
    db.notes.push({ id: noteId, deckId, front, back, tags, created: Date.now() });
    db.cards.push({ id: uid(), noteId, deckId, state: 'new', due: Date.now(), interval: 0, easeFactor: 2.5, repetitions: 0, learningStep: 0, lapses: 0, lastReviewed: null });
  }
  saveDB();
  closeModal('modal-card');
  renderDecks();
  renderBrowse();
}

function deleteCard() {
  if (!editingNoteId) return;
  if (!confirm('Slet dette kort?')) return;
  db.notes = db.notes.filter(n => n.id !== editingNoteId);
  db.cards = db.cards.filter(c => c.noteId !== editingNoteId);
  saveDB();
  closeModal('modal-card');
  renderBrowse();
}

// Import modal
function openImportModal() {
  populateDeckSelect('import-deck-select', (db.decks[0] || {}).id);
  document.getElementById('tsv-paste').value = '';
  document.getElementById('import-area').innerHTML = '📂 Tryk her for at vælge .tsv eller .txt fil<input type="file" id="tsv-file" accept=".tsv,.txt,.csv" style="display:none" onchange="handleFileImport(event)">';
  openModal('modal-import');
}

function handleFileImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('tsv-paste').value = e.target.result;
    document.getElementById('import-area').innerHTML = '✅ ' + esc(file.name) + ' indlæst';
  };
  reader.readAsText(file, 'UTF-8');
}

function doImport() {
  const raw = document.getElementById('tsv-paste').value.trim();
  if (!raw) { alert('Ingen data at importere.'); return; }
  const deckId = document.getElementById('import-deck-select').value;
  const lines = raw.split('\n').filter(l => l.trim());
  let count = 0;
  lines.forEach(line => {
    const parts = line.split('\t');
    let front, back;
    if (parts.length >= 3) {
      // Format: nr | front | back
      front = parts[1]?.trim();
      back  = parts[2]?.trim();
    } else if (parts.length === 2) {
      front = parts[0]?.trim();
      back  = parts[1]?.trim();
    }
    if (!front || !back) return;
    const noteId = uid();
    db.notes.push({ id: noteId, deckId, front, back, tags: [], created: Date.now() });
    db.cards.push({ id: uid(), noteId, deckId, state: 'new', due: Date.now(), interval: 0, easeFactor: 2.5, repetitions: 0, learningStep: 0, lapses: 0, lastReviewed: null });
    count++;
  });
  saveDB();
  closeModal('modal-import');
  renderDecks();
  alert(`✅ ${count} kort importeret!`);
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

</svg>`;

  // Favicon (SVG)
  const svgUri = 'data:image/svg+xml,' + encodeURIComponent(svg);
  const fav = document.createElement('link');
  fav.rel = 'icon'; fav.type = 'image/svg+xml'; fav.href = svgUri;
  document.head.appendChild(fav);

  // Apple Touch Icon – render SVG → canvas → PNG
  const img = new Image();
  img.onload = () => {
    const canvas = Object.assign(document.createElement('canvas'), { width: 180, height: 180 });
    canvas.getContext('2d').drawImage(img, 0, 0, 180, 180);
    const al = document.createElement('link');
    al.rel = 'apple-touch-icon';
    al.href = canvas.toDataURL('image/png');
    document.head.appendChild(al);
  };
  img.src = svgUri;

  // Web App Manifest (so Android/Chrome shows install prompt)
  try {
    const manifest = {
      name: 'FlashDeck',
      short_name: 'FlashDeck',
      description: 'Spaced repetition flashcards',
      start_url: '.',
      display: 'standalone',
      background_color: '#0f0f14',
      theme_color: '#7c6fff',
      orientation: 'portrait-primary'
    };
    const ml = document.createElement('link');
    ml.rel = 'manifest';
    ml.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }));
    document.head.appendChild(ml);
  } catch(e) {}
})();

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (session && session.flipped) {
    if (e.key === '1') rate(1);
    if (e.key === '2') rate(2);
    if (e.key === '3') rate(3);
    if (e.key === '4') rate(4);
  }
  if (session && !session.flipped && (e.key === ' ' || e.key === 'Enter')) {
    flipCard();
  }
});
